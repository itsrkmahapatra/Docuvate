name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate:
    name: Validate Static Assets & Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript Syntax
        run: |
          echo "Checking JavaScript syntax..."
          node -c js/app.js
          node -c js/inkscribe.js
          node -c js/upi-widget.js
          node -c sw.js

      - name: Validate Manifest & Configuration
        run: |
          echo "Validating JSON configurations..."
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')); console.log('manifest.json is valid');"
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); console.log('package.json is valid');"

      - name: Verify Key Tool Pages Exist
        run: |
          echo "Verifying presence of core studio HTML files..."
          for file in index.html compress-pdf.html merge-pdf.html split-pdf.html image-to-pdf.html pdf-to-image.html convert-image.html crop-image.html passport-photo.html protect-pdf.html sign-pdf.html ocr-pdf.html inkscribe.html; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
            echo "✓ $file exists"
          done
